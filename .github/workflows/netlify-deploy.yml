name: Manual Netlify draft
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legacy-music-group-reviewed-draft
  cancel-in-progress: false
jobs:
  draft:
    if: startsWith(github.ref, 'refs/heads/fix/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run verify
      - run: npm run test:browser
      - name: Upload this verified draft only
        run: npx --yes netlify-cli@26.1.0 deploy --no-build --dir=dist --site=d04515bf-0eb2-45ae-b71b-2a08dc92391a --alias=lfnyc-audit-2026-10-09 --message="Legacy reviewed draft $GITHUB_SHA"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
# No push trigger, no ambient site ID, no production flag, no paid AI review.
