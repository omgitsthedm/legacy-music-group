          <section>
            <h2 style="font-size:28px;margin:32px 0 12px;">What is Legacy Music Group?</h2>
            <p style="font-size:16px;line-height:1.7;color:#A38F7B;">
              Legacy Music Group is a full-service recording studio and production
              company in the heart of Deep Ellum. Owned and operated by music business
              maven Matthew Medlock — a 10-year music industry veteran with a Music
              Business degree and a GRAMMYU background — Legacy was built to be the
              studio serious independent artists in Dallas have been looking for.
            </p>
            <p style="font-size:16px;line-height:1.7;color:#A38F7B;">
              We specialize in vocals across genres but handle whatever the song calls
              for: tracking, mixing, mastering, drum and band sessions, voiceover,
              podcasts, and advertisements. In-house producers and songwriters help
              shape projects from idea to release.
            </p>
          </section>

          <section>
            <h2 style="font-size:28px;margin:32px 0 12px;">How does pricing work?</h2>
            <p style="font-size:16px;line-height:1.7;color:#A38F7B;">
              Recording is $75 per hour with an engineer or $45 per hour without — two-hour
              minimum, with discounts on five-hour blocks. Mixing starts at $150 per song
              and mastering at $30. Custom production with a Legacy producer is $500.
              Engineer rates are $55/hour for Room A and $45/hour for Room B; major-label
              sessions $175/hour. Lessons $100, consultations $99, listening parties $125
              with a 3-hour minimum, graphic design priced per project.
            </p>
            <p style="font-size:16px;line-height:1.7;color:#A38F7B;">
              Bundled packages: Starter ($399) for 2 hours plus 1 mix and 1 master plus
              cover art and an Instagram story; Pro ($999) for 5 hours plus 3 mixes and
              3 masters plus cover art, Instagram story, consultation, and a 1-hour
              photoshoot; Album ($2,900) for 10 hours plus 7 mixes and 7 masters plus
              full music video production, photoshoot, and social-media content.
            </p>
          </section>

          <section>
            <h2 style="font-size:28px;margin:32px 0 12px;">Who are the engineers?</h2>
            <p style="font-size:16px;line-height:1.7;color:#A38F7B;">
              Owner and manager Matthew Medlock leads operations and artist development.
              Head engineer Ray Dallas handles mixing, tracking, editing, and Melodyne
              with credits including Mac Miller, B.o.B, Dorrough, and Young Jeezy. Wayne
              is a studio engineer and producer focused on mixing and Pro Tools
              production. Terry handles studio maintenance to keep the gear dialed.
            </p>
          </section>

          <section>
            <h2 style="font-size:28px;margin:32px 0 12px;">Why book at Legacy?</h2>
            <p style="font-size:16px;line-height:1.7;color:#A38F7B;">
              Legacy is rated 4.4 stars on Google with 128 reviews. Pricing is published,
              not hidden. Booking takes about a minute through our online calendar.
              The chain is broadcast-grade — Avid C24, UA Apollo, Avalon 737, Neumann
              U 87 — and the room is acoustically treated with a floating-ceiling vocal
              booth tuned for hip-hop and R&B vocal articulation. We're located right in
              the heart of Deep Ellum at 2815 Main St, Suite A.
            </p>
