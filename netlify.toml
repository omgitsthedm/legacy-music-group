[build]
  command = "npm run verify"
  publish = "dist"
  # Git pushes run CI, not hosting releases. Upload only a verified local artifact.
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "24.21.0"
  ASTRO_TELEMETRY_DISABLED = "1"
  NPM_CONFIG_FUND = "false"

[dev]
  command = "npm run dev"
  targetPort = 52761
  port = 52763
  framework = "#custom"

# No SPA fallback: every public route is an actual HTML document.
