[build]
  command = "npm run verify"
  publish = "dist"
  # Source pushes run checks. Only a verified artifact is uploaded manually.
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "24.21.0"
  NPM_CONFIG_FUND = "false"

[dev]
  command = "npm run dev"
  targetPort = 52764
  port = 52767
  framework = "#custom"

# Generated deep-route documents and public/_redirects own routing and true 404s.
